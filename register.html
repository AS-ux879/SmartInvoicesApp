<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 تسجيل مستخدم جديد - Smart Invoices</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/SmartInvoicesApp/styles.css">

  <!-- Manifest -->
  <link rel="manifest" href="/SmartInvoicesApp/manifest.json">
  <meta name="theme-color" content="#264653">

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/SmartInvoicesApp/service-worker.js")
        .then(() => console.log("SW Registered"))
        .catch(err => console.log("SW Error:", err));
      });
    }
  </script>
</head>

<body>

  <div class="container">
    <h1 id="title">📝 تسجيل مستخدم جديد</h1>

    <form id="registerForm">
      <label for="name">الاسم الكامل:</label>
      <input type="text" id="name" placeholder="اكتب اسمك الكامل" required>

      <label for="email">البريد الإلكتروني:</label>
      <input type="email" id="email" placeholder="example@email.com" required>

      <label for="password">كلمة المرور:</label>
      <input type="password" id="password" placeholder="•••••••" required>

      <button type="submit" id="registerBtn">تسجيل</button>
    </form>

    <p>
      لديك حساب؟
      <a href="/SmartInvoicesApp/login.html">تسجيل الدخول</a>
    </p>
  </div>

  <!-- Firebase -->
  <script type="module" src="/SmartInvoicesApp/firebase.js"></script>

  <!-- Register Logic -->
  <script type="module" src="/SmartInvoicesApp/register.js"></script>

</body>
</html>
