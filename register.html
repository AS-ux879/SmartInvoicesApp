<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 تسجيل مستخدم جديد - Smart Invoices</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- استيراد ملف تهيئة Firebase كنظام وحدة -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="notification.js"></script>
</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <button id="langBtn">🌐 English</button>
    </div>

    <h1 id="title">📝 تسجيل مستخدم جديد</h1>

    <form id="registerForm">
      <label id="labelName" for="name">الاسم الكامل:</label>
      <input type="text" id="name" placeholder="اكتب اسمك الكامل" required>

      <label id="labelEmail" for="email">البريد الإلكتروني:</label>
      <input type="email" id="email" placeholder="example@email.com" required>

      <label id="labelPassword" for="password">كلمة المرور:</label>
      <input type="password" id="password" placeholder="•••••••" required>

      <button type="submit" id="registerBtn">تسجيل</button>
    </form>

    <p id="haveAccount">لديك حساب؟ <a href="index.html" id="loginLink">تسجيل الدخول</a></p>
  </div>
  
  <div id="notificationContainer"></div>
  
  <!-- استيراد منطق التسجيل كنظام وحدة -->
  <script type="module" src="register.js"></script>
</body>
</html>
