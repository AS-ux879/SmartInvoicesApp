<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📌 Smart Invoices</title>

  <!-- Manifest -->
  <link rel="manifest" href="/SmartInvoicesApp/manifest.json">
  <meta name="theme-color" content="#264653">

  <!-- Register SW Automatically -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/SmartInvoicesApp/service-worker.js")
        .then(() => console.log("SW Registered Successfully"))
        .catch(err => console.log("SW Failed:", err));
      });
    }
  </script>

  <link rel="stylesheet" href="/SmartInvoicesApp/styles.css">
</head>
<body>

  <div class="container welcome">
    <h1>📊 Smart Invoices</h1>
    <p>إدارة فواتيرك بسهولة</p>

    <button onclick="location.href='/SmartInvoicesApp/login.html'">تسجيل الدخول</button>
    <button onclick="location.href='/SmartInvoicesApp/register.html'">إنشاء حساب</button>
  </div>

</body>
</html>
