<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 لوحة الفواتير - Smart Invoices</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="container">
    <h1>📊 لوحة الفواتير</h1>
    <p><span id="greet">مرحبًا</span> <span id="userName"></span> 👋</p>

    <!-- إضافة الفاتورة -->
    <form id="invoiceForm">
      <input type="file" id="invoiceImage" accept="image/*" required>
      <input type="text" id="invoiceName" placeholder="اسم الفاتورة" required>
      <input type="number" id="invoiceAmount" placeholder="المبلغ (ريال)" required>
      <input type="date" id="invoiceDate" required>
      <input type="number" id="invoiceWarranty" placeholder="الضمان (شهر)">
      <button type="submit">➕ إضافة</button>
    </form>

    <!-- قائمة الفواتير -->
    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>المبلغ</th>
          <th>التاريخ</th>
          <th>الضمان</th>
          <th>عرض</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="invoiceList"></tbody>
    </table>

    <!-- التحليل المالي -->
    <h2>📈 التحليل المالي</h2>
    <canvas id="chart" width="600" height="380"></canvas>

    <!-- تنبيهات الضمان -->
    <h2>⏰ تنبيهات انتهاء الضمان</h2>
    <ul id="warrantyList"></ul>

    <button id="logoutBtn" class="logout-btn">🚪 تسجيل الخروج</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
