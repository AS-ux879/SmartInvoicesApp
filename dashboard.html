<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 لوحة الفواتير - Smart Invoices</title>
  <link rel="stylesheet" href="styles.css">

  <!-- مكتبات PDF والتصوير -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Firebase + Dashboard Scripts (Modules) -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>

</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <button id="langBtn">🌐 English</button>
    </div>

    <h1 id="title">📊 لوحة الفواتير</h1>
    <p><span id="greet">مرحبًا</span> <span id="userName"></span> 👋</p>

    <form id="invoiceForm">
      <label id="labelImage" for="invoiceImage">📷 صورة الفاتورة :</label>
      <input type="file" id="invoiceImage" accept="image/*" required>

      <button type="submit" id="addBtn">➕ إضافة الفاتورة</button>
    </form>

    <h2 id="listTitle">🧾 قائمة الفواتير</h2>
    <table border="1" width="100%">
      <thead>
        <tr>
          <th id="thName">الاسم</th>
          <th id="thAmount">المبلغ</th>
          <th id="thDate">التاريخ</th>
          <th id="thImage">الصورة</th>
          <th id="thAction">إجراء</th>
        </tr>
      </thead>
      <tbody id="invoiceList"></tbody>
    </table>

    <button class="logout-btn" id="logoutBtn" onclick="logout()">🚪 تسجيل الخروج</button>
  </div>

</body>
</html>
