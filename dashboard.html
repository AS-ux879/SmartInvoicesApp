<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الفواتير</title>
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="container">
  <h2>لوحة الفواتير 📊</h2>
  <p id="userName">مرحباً</p>

  <form id="invoiceForm">
    <label>📸 صورة الفاتورة:</label>
    <input type="file" id="invoiceImage" accept="image/*">

    <label>اسم الفاتورة:</label>
    <input type="text" id="invoiceName" placeholder="جار تحليل الصورة…">

    <label>المبلغ (ريال):</label>
    <input type="number" id="invoiceAmount" placeholder="مثال: 2500">

    <label>التاريخ:</label>
    <input type="date" id="invoiceDate">

    <label>مدة الضمان (بالأشهر):</label>
    <input type="number" id="invoiceWarranty" placeholder="مثال: 12">

    <button type="submit">إضافة الفاتورة ➕</button>
  </form>

  <h3>قائمة الفواتير 🧾</h3>
  <table>
    <thead>
      <tr>
        <th>الاسم</th>
        <th>المبلغ</th>
        <th>التاريخ</th>
        <th>الضمان</th>
        <th>عرض</th>
        <th>حذف</th>
      </tr>
    </thead>
    <tbody id="invoiceList"></tbody>
  </table>

  <h3>📈 التحليل المالي</h3>
  <canvas id="chart"></canvas>

  <button id="logoutBtn" class="logout-btn">تسجيل الخروج 🔐</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="dashboard.js"></script>

</body>
</html>
