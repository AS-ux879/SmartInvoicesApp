<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 لوحة الفواتير - Smart Invoices</title>

  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
</head>

<body>

  <div class="container">
    <h1 id="title">📊 لوحة الفواتير</h1>
    <p><span id="greet">مرحبًا</span> <span id="userName"></span> 👋</p>

    <form id="invoiceForm">
      <label for="invoiceImage">📷 صورة الفاتورة:</label>
      <input type="file" id="invoiceImage" accept="image/*">

      <label for="invoiceName">اسم الفاتورة:</label>
      <input type="text" id="invoiceName" placeholder="مثال: فاتورة جوال">

      <label for="invoiceAmount">المبلغ (ريال):</label>
      <input type="number" id="invoiceAmount" placeholder="مثال: 2500">

      <label for="invoiceDate">التاريخ:</label>
      <input type="date" id="invoiceDate">

      <label for="invoiceWarranty">مدة الضمان (بالأشهر):</label>
      <input type="number" id="invoiceWarranty" placeholder="مثال: 12">

      <button type="submit">➕ إضافة الفاتورة</button>
    </form>

    <h2>🧾 قائمة الفواتير</h2>
    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>المبلغ</th>
          <th>التاريخ</th>
          <th>الضمان</th>
          <th>عرض</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="invoiceList"></tbody>
    </table>

    <button class="logout-btn" id="logoutBtn">🚪 تسجيل الخروج</button>
  </div>

  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./dashboard.js"></script>

</body>
</html>
