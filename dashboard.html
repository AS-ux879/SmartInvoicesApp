<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 لوحة الفواتير - Smart Invoices</title>
  <link rel="stylesheet" href="styles.css">

  <!-- مكتبات تصوير الشاشة وتصدير PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <button id="langBtn">🌐 English</button>
    </div>

    <h1 id="title">📊 لوحة الفواتير</h1>
    <p><span id="greet">مرحبًا</span> <span id="userName"></span> 👋</p>

    <form id="invoiceForm">
      <label id="labelName" for="invoiceName">اسم الفاتورة:</label>
      <input type="text" id="invoiceName" placeholder="مثال: فاتورة جوال" required>

      <label id="labelAmount" for="invoiceAmount">المبلغ (ريال):</label>
      <input type="number" id="invoiceAmount" placeholder="مثال: 2500" required>

      <label id="labelDate" for="invoiceDate">التاريخ:</label>
      <input type="date" id="invoiceDate" required>

      <label id="labelWarranty" for="invoiceWarranty">مدة الضمان (بالأشهر):</label>
      <input type="number" id="invoiceWarranty" placeholder="مثال: 12" required>

      <label id="labelImage" for="invoiceImage">📷 صورة الضمان:</label>
      <input type="file" id="invoiceImage" accept="image/*,application/pdf">

      <button type="submit" id="addBtn">➕ إضافة الفاتورة</button>
    </form>

    <h2 id="listTitle">🧾 قائمة الفواتير</h2>
    <table border="1" width="100%">
      <thead>
        <tr>
          <th id="thName">الاسم</th>
          <th id="thAmount">المبلغ (ريال)</th>
          <th id="thDate">التاريخ</th>
          <th id="thWarranty">الضمان (أشهر)</th>
          <th id="thImage">صورة الضمان</th>
          <th id="thAction">إجراء</th>
        </tr>
      </thead>
      <tbody id="invoiceList"></tbody>
    </table>

    <div style="margin-top: 15px;">
      <button id="captureBtn">📸 تصوير الفواتير</button>
      <button id="pdfBtn">📄 حفظ كـ PDF</button>
    </div>

    <button class="logout-btn" id="logoutBtn">🚪 تسجيل الخروج</button>
  </div>

  <!-- Firebase يجب أن يحمل أولاً -->
  <script type="module" src="firebase.js"></script>

  <!-- سكربت لوحة التحكم -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
