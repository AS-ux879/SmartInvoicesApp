<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 لوحة الفواتير - Smart Invoices</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <h1>📊 لوحة الفواتير</h1>
    <p><span id="greet">مرحبًا</span> <span id="userName"></span> 👋</p>

    <!-- نموذج إضافة الفاتورة -->
    <form id="invoiceForm">

      <label for="invoiceName">اسم الفاتورة:</label>
      <input type="text" id="invoiceName" placeholder="مثال: فاتورة جوال" required>

      <label for="invoiceAmount">المبلغ (ريال):</label>
      <input type="number" id="invoiceAmount" placeholder="مثال: 2500" required>

      <label for="invoiceDate">التاريخ:</label>
      <input type="date" id="invoiceDate" required>

      <label for="invoiceImage">📷 صورة الفاتورة:</label>
      <input type="file" id="invoiceImage" accept="image/*" capture="environment" required>

      <button type="submit" id="addBtn">➕ إضافة الفاتورة</button>

    </form>

    <h2>🧾 قائمة الفواتير</h2>

    <table border="1" width="100%">
      <thead>
        <tr>
          <th>الاسم</th>
          <th>المبلغ</th>
          <th>التاريخ</th>
          <th>صورة الفاتورة</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody id="invoiceList"></tbody>
    </table>

    <button class="logout-btn" id="logoutBtn">🚪 تسجيل الخروج</button>

  </div>

  <!-- Firebase + Dashboard Logic -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>

</body>
</html>
