<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 لوحة الفواتير - Smart Invoices</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#264653">

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker Registered"))
        .catch(err => console.error("SW Error:", err));
    }
  </script>
</head>

<body>

  <div class="container">

    <h1 id="title">📊 لوحة الفواتير</h1>
    <p><span id="greet">مرحبًا</span> <span id="userName">...</span> 👋</p>

    <!-- نموذج إضافة الفاتورة -->
    <form id="invoiceForm">

      <label for="invoiceImage">📷 صورة الفاتورة:</label>
      <input type="file" id="invoiceImage" accept="image/*">

      <label for="invoiceName">اسم الفاتورة:</label>
      <input type="text" id="invoiceName" placeholder="مثال: فاتورة جوال">

      <label for="invoiceAmount">المبلغ (ريال):</label>
      <input type="number" id="invoiceAmount" placeholder="مثال: 2500">

      <label for="invoiceDate">التاريخ:</label>
      <input type="date" id="invoiceDate">

      <label for="invoiceWarranty">مدة الضمان (بالأشهر):</label>
      <input type="number" id="invoiceWarranty" placeholder="مثال: 12">

      <button type="submit" id="addBtn">➕ إضافة الفاتورة</button>
    </form>

    <h2>🧾 قائمة الفواتير</h2>

    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>المبلغ</th>
          <th>التاريخ</th>
          <th>الضمان</th>
          <th>الفاتورة</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody id="invoiceList"></tbody>
    </table>

    <button class="logout-btn" id="logoutBtn" onclick="logout()">🚪 تسجيل الخروج</button>

  </div>

  <!-- Firebase + App Logic -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>

</body>
</html>
