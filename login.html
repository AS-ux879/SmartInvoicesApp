<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 تسجيل الدخول - Smart Invoices</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/SmartInvoicesApp/styles.css">

  <!-- Manifest -->
  <link rel="manifest" href="/SmartInvoicesApp/manifest.json">
  <meta name="theme-color" content="#264653">

  <!-- Register Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/SmartInvoicesApp/service-worker.js")
          .then(() => console.log("SW Registered"))
          .catch(err => console.log("SW Error:", err));
      });
    }
  </script>
</head>

<body>

  <div class="container">
    <h1 id="title">🔐 تسجيل الدخول</h1>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني:</label>
      <input type="email" id="email" placeholder="example@email.com" required>

      <label for="password">كلمة المرور:</label>
      <input type="password" id="password" placeholder="•••••••" required>

      <button type="submit" id="loginBtn">تسجيل الدخول</button>
    </form>

    <p>
      ليس لديك حساب؟
      <a href="/SmartInvoicesApp/register.html">إنشاء حساب جديد</a>
    </p>
  </div>

  <!-- Firebase -->
  <script type="module" src="/SmartInvoicesApp/firebase.js"></script>

  <!-- Login Logic -->
  <script type="module" src="/SmartInvoicesApp/login.js"></script>

</body>
</html>
